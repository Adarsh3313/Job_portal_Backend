server:
  port: 8066

spring:
  application:
    name: api-gateway

  config:
    import: "optional:configserver:http://localhost:8888"

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true          # lets you also hit routes as /SERVICE-NAME/** automatically
          lower-case-service-id: true

      # CORS applied globally to every route
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        - id: authentication-service
          uri: lb://authentication-service
          predicates:
            - Path=/api/auth/**

        - id: company-service
          uri: lb://company-service
          predicates:
            - Path=/api/companies/**

        - id: hiring-service
          uri: lb://hiring-service
          predicates:
            - Path=/api/jobs/**

        - id: interview-service
          uri: lb://interview-service
          predicates:
            - Path=/api/interviews/**

        - id: job-application-service
          uri: lb://job-application-service
          predicates:
            - Path=/api/applications/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

        - id: resume-service
          uri: lb://resume-service
          predicates:
            - Path=/api/resumes/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.transpogov.apigateway: DEBUG
