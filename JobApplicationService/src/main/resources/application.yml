server:
  port: 8099
spring:
  application:
    name: job-application-service

  # Pulls shared config from ConfigServer at startup (spring-cloud-config-client, Spring Boot 3.x style)
  config:
    import: "optional:configserver:http://localhost:8888"

  datasource:
    url: jdbc:mysql://sql12.freesqldatabase.com:3306/sql12839549
    username: sql12839549
    password: mDqTJDdEWe
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

 eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# Feign / Resilience timeouts when calling HiringService & NotificationService
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.transpogov.jobapplicationservice: DEBUG
